<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/main.css">
  
  <title>Frontend Mentor | Product preview card component</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article class = "card">
      <picture class = "card__image">
        <source media="(min-width: 768px)" srcset="images\image-product-desktop.jpg">
        <img src="images/image-product-mobile.jpg" alt="Perfume bottle resting in green">
      </picture>
     
      <div class = "card__content">
        <p class = "card__category">Perfume</p>
        <h1 class = "card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class = "card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
      </div>
      <div class = "card__prices">
        <span class = "card__price">$149.99</span>
        <s class="card__old-price">$169.99</s>
      </div>

      <button class = "card__button">
        <img src="images/icon-cart.svg" alt="add to cart icon">
        Add to Cart
      </button>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
